bundle:
  name: capital-projects-lakehouse

include:
  - resources/*.yml

variables:
  alert_email:
    description: Email that receives failure alerts
  schedule_status:
    description: PAUSED or UNPAUSED
    default: PAUSED

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-e94639e6-6bcb.cloud.databricks.com
    variables:
      alert_email: abdelrahman2556250@gmail.com

  prod:
    workspace:
      host: https://dbc-e94639e6-6bcb.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/prod
    variables:
      alert_email: abdelrahman2556250@gmail.com
      schedule_status: UNPAUSED